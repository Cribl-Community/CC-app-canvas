# External API declarations for Cribl Vibe Coder
# The platform proxy injects auth headers and validates these domains at request time.

api.anthropic.com:
  timeout: 120000
  paths:
    allowlist:
      - /v1/messages

# AWS Bedrock — common regions (add more as needed)
# Requests are signed in-browser with SigV4 before reaching the proxy.
bedrock-runtime.us-east-1.amazonaws.com:
  timeout: 120000

bedrock-runtime.us-west-2.amazonaws.com:
  timeout: 120000

bedrock-runtime.eu-west-1.amazonaws.com:
  timeout: 120000

bedrock-runtime.eu-central-1.amazonaws.com:
  timeout: 120000

bedrock-runtime.ap-northeast-1.amazonaws.com:
  timeout: 120000

bedrock-runtime.ap-southeast-1.amazonaws.com:
  timeout: 120000

bedrock-runtime.ap-southeast-2.amazonaws.com:
  timeout: 120000

# esm.sh CDN — used by esbuild-wasm to resolve npm packages at bundle time
esm.sh:
  timeout: 30000

# unpkg.com — used to load esbuild.wasm
unpkg.com:
  timeout: 30000

# Tailwind CSS CDN — used in preview iframe for generated app styling
cdn.tailwindcss.com:
  timeout: 30000
